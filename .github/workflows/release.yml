name: Release

on:
  push:
    tags:
      - 'v*'

# The build jobs run other people's code: the build script of every dependency,
# and third-party actions. The token they hold can read and nothing else. The one
# job that has to write, the one that creates the draft release, asks for that
# itself.
permissions:
  contents: read

jobs:
  # A release has to be able to update itself, and --update refuses to run
  # without a signing key built in. Find that out before spending time on four
  # cross builds, not after publishing a release nobody can upgrade from.
  preflight:
    name: Release can update itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml
        # The updater runs the downloaded binary with --version and insists on
        # exactly the version the signature names. A mismatch here would make
        # every client reject this release.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: minisign.pub holds a signing key
        run: cargo test --locked release_builds_must_ship_an_update_key -- --ignored
      - name: The build can verify the hosts it updates from
        # Every other test talks plain http to localhost. A build whose
        # certificate roots do not cover GitHub could never update itself, nor be
        # updated to a fixed release.
        run: cargo test --locked release_builds_must_verify_the_hosts -- --ignored

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: oxiclean-x86_64-linux-gnu
          - target: x86_64-unknown-linux-musl
            name: oxiclean-x86_64-linux-musl
          - target: aarch64-unknown-linux-gnu
            name: oxiclean-aarch64-linux-gnu
          - target: aarch64-unknown-linux-musl
            name: oxiclean-aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (x86)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: Set up cross toolchain (arm64)
        if: contains(matrix.target, 'aarch64')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      # --locked: the release is built from the dependency versions that were
      # reviewed and tested, never from a fresh resolution.
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/oxiclean ${{ matrix.name }}
      - name: Record the checksum
        # What scripts/sign-release.sh asks the maintainer to compare with.
        run: sha256sum ${{ matrix.name }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # A draft, so nobody (install.sh and `oxiclean --update` included)
          # sees it until the checksum list has been signed offline with
          # scripts/sign-release.sh and the draft has been published by hand.
          # See RELEASING.md.
          draft: true
          files: |
            artifacts/oxiclean-x86_64-linux-gnu/oxiclean-x86_64-linux-gnu
            artifacts/oxiclean-x86_64-linux-musl/oxiclean-x86_64-linux-musl
            artifacts/oxiclean-aarch64-linux-gnu/oxiclean-aarch64-linux-gnu
            artifacts/oxiclean-aarch64-linux-musl/oxiclean-aarch64-linux-musl
