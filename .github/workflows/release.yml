name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: oxiclean-x86_64-linux-gnu
          - target: x86_64-unknown-linux-musl
            name: oxiclean-x86_64-linux-musl
          - target: aarch64-unknown-linux-gnu
            name: oxiclean-aarch64-linux-gnu
          - target: aarch64-unknown-linux-musl
            name: oxiclean-aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (x86)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: Set up cross toolchain (arm64)
        if: contains(matrix.target, 'aarch64')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/oxiclean ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/oxiclean-x86_64-linux-gnu/oxiclean-x86_64-linux-gnu
            artifacts/oxiclean-x86_64-linux-musl/oxiclean-x86_64-linux-musl
            artifacts/oxiclean-aarch64-linux-gnu/oxiclean-aarch64-linux-gnu
            artifacts/oxiclean-aarch64-linux-musl/oxiclean-aarch64-linux-musl
