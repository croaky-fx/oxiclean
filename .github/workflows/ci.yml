name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # --locked: a change to Cargo.toml that did not bring Cargo.lock along fails
      # here, not at the release, where it would be built from a fresh resolution.
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose
      - run: cargo clippy --locked -- -D warnings
      - run: cargo fmt -- --check
      - name: Release signing script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          scripts/test-sign-release.sh
