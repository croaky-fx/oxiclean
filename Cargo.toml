[package]
name = "oxiclean"
version = "1.9.0"
edition = "2021"
# The oldest compiler that builds with Cargo.lock: some of the locked
# dependencies (ureq, zeroize) declare 1.85 themselves. The `msrv` job in CI
# builds with whatever is written here, so it cannot drift unnoticed.
rust-version = "1.85"
description = "Fast cross-distribution Linux system cleaner"
authors = ["croaky-fx <217624563+croaky-fx@users.noreply.github.com>"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "=4.5.20"
colored = "2"
# No gzip/brotli: nothing we download is compressed, and a decoder is one more
# place for a hostile response to misbehave. TLS is rustls with its default
# (ring) provider.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release signatures (--update): a zero-dependency verifier by the author of
# minisign, and SHA-256 from ring, which rustls already pulls in.
minisign-verify = "0.3"
ring = "0.17"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
